name: Nearby Connect - Build APK (Gradle 8.13)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: nearby-connect-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Nearby Connect APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # AGP 8.13.2 requires Gradle 8.13. Pin it explicitly; never use runner Gradle 9.x.
      - name: Install exact compatible Gradle version
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false

      - name: Find project directory
        id: project
        shell: bash
        run: |
          if [ -f "P2p-messenger/app/build.gradle.kts" ] && [ -f "P2p-messenger/settings.gradle.kts" ]; then
            echo "dir=P2p-messenger" >> "$GITHUB_OUTPUT"
          elif [ -f "app/build.gradle.kts" ] && [ -f "settings.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "NearbyConnect/app/build.gradle.kts" ] && [ -f "NearbyConnect/settings.gradle.kts" ]; then
            echo "dir=NearbyConnect" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Android project not found. Expected P2p-messenger/app, app, or NearbyConnect/app."
            echo "Repository layout:"
            find . -maxdepth 4 -type f | sort | head -250
            exit 1
          fi
          echo "Selected project directory: $(cat "$GITHUB_OUTPUT" | tail -1)"

      - name: Verify Java and Gradle versions
        shell: bash
        run: |
          java -version
          gradle --version
          ACTUAL="$(gradle --version | awk '/^Gradle / {print $2; exit}')"
          if [ "$ACTUAL" != "8.13" ]; then
            echo "ERROR: Expected Gradle 8.13 but found $ACTUAL"
            exit 1
          fi

      - name: Verify Android Gradle Plugin pin
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          grep -R --include='*.gradle.kts' -n 'com.android.application.*8.13.2' .. || true
          grep -q 'com.android.application.*8.13.2' ../build.gradle.kts || grep -q 'com.android.application.*8.13.2' build.gradle.kts

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NearbyConnect-v1.0.2-debug
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NearbyConnect-build-reports
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
